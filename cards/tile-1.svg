<svg xmlns="http://www.w3.org/2000/svg" width="270" height="112" viewBox="0 0 270 112" role="img" aria-label="PROFILE: GitHub">
<title>PROFILE: GitHub</title>
<style>@font-face{font-family:'pf-mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
.f-mono{font-family:'pf-mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}
@font-face{font-family:'pf-display';font-weight:700;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
.f-display{font-family:'pf-display',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
@font-face{font-family:'pf-body';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
.f-body{font-family:'pf-body',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}

@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.growy{transform-box:fill-box;transform-origin:50% 100%;animation:growy .9s cubic-bezier(.2,.7,.2,1) both}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .9s cubic-bezier(.2,.7,.2,1) both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .8s cubic-bezier(.2,.9,.3,1.1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.smil{display:none}}
</style>
<defs><clipPath id="clip"><rect width="270" height="112" rx="14"/></clipPath></defs>
<rect x=".5" y=".5" width="269" height="111" rx="14" fill="#111a24" stroke="#263445" class="fade" style="animation-delay:0.55s"/>
<text x="24.0" y="32.0" font-size="11" fill="#58a6ff" letter-spacing="1.2" class="f-mono rise" style="animation-delay:0.65s">PROFILE</text>
<text x="24.0" y="64.0" font-size="20" fill="#e6edf3" class="f-display rise" style="animation-delay:0.73s">GitHub</text>
<text x="24.0" y="88.0" font-size="13" fill="#91a4b7" class="f-body rise" style="animation-delay:0.81s">Explore my repositories</text>
<path d="M236 30L246 20M238 20H246V28" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="fade" style="animation-delay:0.85s"/>
<g clip-path="url(#clip)"><rect x="0" y="109" width="270" height="3" fill="#58a6ff" class="growx" style="animation-delay:0.90s"/></g>
</svg>
