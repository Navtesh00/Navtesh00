name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/render_cards.py", "assets/**"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and pinned repos
        env:
          # Add a PAT with read:user as PROFILE_TOKEN to include private contribution counts.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api graphql -f login="${GITHUB_REPOSITORY_OWNER}" -f query='
            query($login:String!){
              user(login:$login){
                login name bio
                pinnedItems(first:6, types:REPOSITORY){ nodes{ ... on Repository{
                  name description url stargazerCount forkCount primaryLanguage{ name color } } } }
                contributionsCollection{ contributionCalendar{ totalContributions
                  weeks{ contributionDays{ date contributionCount } } } }
              }
              featuredAgentCart: repository(owner:"Navtesh00", name:"agentcart"){
                name description url stargazerCount forkCount primaryLanguage{ name color }
              }
              featuredUrlShortener: repository(owner:"Navtesh00", name:"url-shortner"){
                name description url stargazerCount forkCount primaryLanguage{ name color }
              }
            }' > data/contributions.json

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Validate and render cards
        run: |
          pip install fonttools pillow
          python -m py_compile scripts/render_cards.py
          python scripts/render_cards.py
          test -s cards/hero.svg
          test -s cards/repo-1.svg
          test -s cards/repo-2.svg
          test -s cards/contributions-monthly.svg
          test -s cards/contribution-graph.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards README.md
          if git diff --staged --quiet; then echo "nothing changed"; else
            git commit -m "chore: refresh profile cards" && git push
          fi
